<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BF Lernakademie</title><style>body{margin:0;background:#101820;color:#eef3f7;font:16px system-ui}header{padding:18px 5%;background:#182632;display:flex;justify-content:space-between}main{max-width:1000px;margin:auto;padding:25px}.card{background:#1b2a36;border:1px solid #344958;border-radius:14px;padding:20px;margin:14px 0}button{background:#d83e42;color:white;border:0;padding:11px 15px;border-radius:9px;margin:5px;cursor:pointer}input,textarea,select{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 15px;background:#0e1820;color:white;border:1px solid #405260;border-radius:8px}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}.muted{color:#a9bac8}.option{display:block;width:100%;text-align:left;background:#273a49}.selected{outline:2px solid #72baff}.hero{padding:45px 0}.hero h1{font-size:clamp(38px,7vw,65px)}.hero span{color:#ff7777}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.bar{height:8px;background:#354957}.bar i{display:block;height:8px;background:#38c98c}.notice{padding:15px;background:#403025;border-radius:10px}@media(max-width:600px){main{padding:14px}}</style><body><header><b>🚒 BF LERNAKADEMIE</b><span id="who"></span></header><main id="app"></main><script>
const $=s=>document.querySelector(s);let me=null,Q=[],A=[],i=0,room='';async function api(p,o={}){let r=await fetch('/api'+p,{credentials:'same-origin',...o,headers:{...(o.body instanceof FormData?{}:{'Content-Type':'application/json'})}}),d=await r.json();if(!r.ok)throw Error(d.error||'Fehler');return d}function say(t){alert(t)}function nav(){return '<div class="tabs"><button onclick="dash()">Fortschritt</button><button onclick="learn()">Lernen</button><button onclick="groups()">Zusammen lernen</button><button onclick="materials()">Material</button><button onclick="admin()">Ausbilder</button></div>'}function home(){$('#app').innerHTML='<section class="hero"><h1>Wissen aufbauen.<br><span>Einsatzbereit werden.</span></h1><p class="muted">Lerne für die Berufsfeuerwehr, übe Fragen, lerne gemeinsam und verfolge deinen Fortschritt.</p><button onclick="auth()">Jetzt starten</button></section><div class="grid"><div class="card">📚 Fragenkatalog</div><div class="card">👥 Lerngruppen</div><div class="card">📈 Fortschritt</div></div><div class="notice">Der Startkatalog ist keine amtliche vollständige BF-Prüfungssammlung. Inhalte unterscheiden sich nach Kommune und Bundesland. Nutze aktuelle offizielle Unterlagen.</div>'}function auth(){$('#app').innerHTML='<div class="card"><h2>Anmelden / Registrieren</h2><input id="u" placeholder="Benutzername"><input id="p" type="password" placeholder="Passwort, mindestens 8 Zeichen"><button onclick="login()">Anmelden</button><button onclick="reg()">Konto erstellen</button></div>'}async function login(){try{me=(await api('/login',{method:'POST',body:JSON.stringify({username:$('#u').value,password:$('#p').value})})).user;dash()}catch(e){say(e.message)}}async function reg(){try{me=(await api('/register',{method:'POST',body:JSON.stringify({username:$('#u').value,password:$('#p').value})})).user;dash()}catch(e){say(e.message)}}async function dash(){let d=await api('/dashboard');$('#who').innerHTML=me.username+' <button onclick="logout()">Abmelden</button>';$('#app').innerHTML=nav()+'<h1>Dein Lernfortschritt</h1><div class="grid"><div class="card">Übungen<h1>'+d.stats.attempts+'</h1></div><div class="card">Durchschnitt<h1>'+d.stats.average+'%</h1></div><div class="card">Richtige Antworten<h1>'+d.stats.correct+'</h1></div></div><div class="card"><h2>Themen</h2>'+d.topics.map(x=>'<p>'+x.topic+' · '+x.average+'%<div class="bar"><i style="width:'+x.average+'%"></i></div></p>').join('')+'</div><div class="card"><h2>Letzte Ergebnisse</h2>'+d.recent.map(x=>'<p>'+x.topic+' · '+x.percent+'%</p>').join('')+'</div>'}async function logout(){await api('/logout',{method:'POST'});me=null;home()}async function learn(){let t=await api('/topics');$('#app').innerHTML=nav()+'<h1>Lernbereiche</h1><div class="grid">'+t.map(x=>'<div class="card"><h3>'+x.topic+'</h3>'+x.count+' Fragen<br><button onclick="start(\''+x.topic+'\')">Üben</button></div>').join('')+'</div><button onclick="start(\'Alle Themen\',20)">Gemischte Prüfung (20 Fragen)</button>'}async function start(t,n=10){Q=await api('/questions?topic='+encodeURIComponent(t)+'&limit='+n);A=[];i=0;question(t)}function question(t){let q=Q[i];$('#app').innerHTML=nav()+'<div class="card"><p>'+q.topic+' · Frage '+(i+1)+'/'+Q.length+'</p><div class="bar"><i style="width:'+i/Q.length*100+'%"></i></div><h2>'+q.question+'</h2>'+q.options.map((x,j)=>'<button class="option '+(A[i]?.choice===j?'selected':'')+'" onclick="pick('+j+',\''+t+'\')">'+String.fromCharCode(65+j)+'. '+x+'</button>').join('')+'<button '+(A[i]?'':'disabled')+' onclick="next(\''+t+'\')">'+(i===Q.length-1?'Auswerten':'Weiter')+'</button></div>'}function pick(j,t){A[i]={id:Q[i].id,choice:j};question(t)}async function next(t){if(i<Q.length-1){i++;question(t);return}let r=await api('/attempts',{method:'POST',body:JSON.stringify({topic:t,answers:A})});$('#app').innerHTML=nav()+'<div class="card"><h1>'+r.percent+'%</h1><h2>'+r.correct+' von '+r.total+' richtig</h2><p>Ergebnis dauerhaft gespeichert.</p><button onclick="review()">Lösungen ansehen</button><button onclick="learn()">Weiterlernen</button></div>'}function review(){let h=nav();Q.forEach(q=>h+='<div class="card"><b>'+q.question+'</b><p>Richtig: '+q.options[q.answer]+'</p><p class="muted">'+q.why+'</p></div>');$('#app').innerHTML=h}async function groups(){let r=await api('/rooms');$('#app').innerHTML=nav()+'<div class="card"><h2>Gruppe erstellen</h2><input id="rt" placeholder="Name"><input id="rp" placeholder="Thema"><button onclick="createRoom()">Erstellen</button></div><div class="card"><h2>Beitreten</h2><input id="rc" placeholder="Gruppencode"><button onclick="join()">Beitreten</button></div><div class="card"><h2>Gruppen</h2>'+r.map(x=>'<p>'+x.title+' · '+x.members+' Mitglieder · Code '+x.code+' <button onclick="joinCode(\''+x.code+'\')">Beitreten</button><button onclick="chat(\''+x.id+'\')">Chat</button></p>').join('')+'</div>'}async function createRoom(){let r=await api('/rooms',{method:'POST',body:JSON.stringify({title:$('#rt').value,topic:$('#rp').value})});say('Gruppencode: '+r.code);groups()}async function join(){joinCode($('#rc').value)}async function joinCode(c){let r=await api('/rooms/join',{method:'POST',body:JSON.stringify({code:c})});chat(r.id)}async function chat(id){room=id;let m=await api('/rooms/'+id+'/messages');$('#app').innerHTML=nav()+'<div class="card"><h2>Gruppenchat</h2>'+m.map(x=>'<p><b>'+x.username+':</b> '+x.message+'</p>').join('')+'<input id="m"><button onclick="send()">Senden</button></div>'}async function send(){await api('/rooms/'+room+'/messages',{method:'POST',body:JSON.stringify({message:$('#m').value})});chat(room)}async function materials(){let m=await api('/materials');$('#app').innerHTML=nav()+'<h1>Unterrichtsmaterial</h1>'+(me.role==='admin'?'<div class="card"><input id="mt" placeholder="Titel"><input id="tp" placeholder="Thema"><input id="file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.txt,.md"><button onclick="upload()">Hochladen</button></div>':'')+'<div class="card">'+m.map(x=>'<p>'+x.title+' · '+x.topic+' · <a href="/api/materials/'+x.id+'">Download</a></p>').join('')+'</div>'}async function upload(){let f=$('#file').files[0],d=new FormData();if(!f)return say('Datei auswählen');d.append('file',f);d.append('title',$('#mt').value);d.append('topic',$('#tp').value);try{await api('/materials',{method:'POST',body:d});materials()}catch(e){say(e.message)}}function admin(){if(me.role!=='admin')return say('Nur Ausbilder');$('#app').innerHTML=nav()+'<div class="card"><h2>Neue Lernfrage</h2><input id="qt" placeholder="Thema"><textarea id="qq" placeholder="Frage"></textarea>'+[0,1,2,3].map(j=>'<input id="o'+j+'" placeholder="Antwort '+(j+1)+'">').join('')+'<select id="qa"><option value="0">Antwort 1 richtig</option><option value="1">Antwort 2 richtig</option><option value="2">Antwort 3 richtig</option><option value="3">Antwort 4 richtig</option></select><textarea id="qe" placeholder="Erklärung"></textarea><button onclick="saveQ()">Veröffentlichen</button></div>'}async function saveQ(){try{await api('/questions',{method:'POST',body:JSON.stringify({topic:$('#qt').value,question:$('#qq').value,options:[0,1,2,3].map(j=>$('#o'+j).value),answer:+$('#qa').value,explanation:$('#qe').value})});say('Frage gespeichert');admin()}catch(e){say(e.message)}}(async()=>{try{me=(await api('/me')).user;dash()}catch{home()}})();
</script></main></body></html>
